<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector Volley — two-player wireframe paddle game</title>
  <meta name="description" content="Two players, one keyboard, first to five. Play the glowing wireframe paddle match right in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vector Volley">
  <meta property="og:title" content="Vector Volley — two-player wireframe paddle game">
  <meta property="og:description" content="Two players, one keyboard, first to five. Play the glowing wireframe paddle match right in your browser.">
  <meta property="og:url" content="https://nawodyaishan.github.io/vector-volley/">
  <meta property="og:image" content="https://nawodyaishan.github.io/vector-volley/preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Glowing cyan and amber wireframe paddle court with a white ball">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Vector Volley — two-player wireframe paddle game">
  <meta name="twitter:description" content="Two players, one keyboard, first to five. Play the glowing wireframe paddle match right in your browser.">
  <meta name="twitter:image" content="https://nawodyaishan.github.io/vector-volley/preview.png">
  <link rel="canonical" href="https://nawodyaishan.github.io/vector-volley/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scoreboard" class="scoreboard">
  <div class="player player--near">
    <span class="player__label">P1 · Near · A/D</span>
    <span class="stripes" aria-hidden="true"><i></i></span>
    <span id="score-near" class="score">0</span>
  </div>
  <button id="restart" type="button">Restart</button>
  <div class="player player--far">
    <span id="score-far" class="score">0</span>
    <span class="stripes stripes--double" aria-hidden="true"><i></i><i></i></span>
    <span class="player__label">P2 · Far · ←/→</span>
  </div>
</div>
<p id="status" class="status" role="status" aria-live="polite">New match. Space to serve.</p>
<p class="legend">First to 5 · Space: serve / resume / replay · R: restart · A/D and ←/→: move</p>
<canvas id="court" tabindex="0" aria-label="Vector Volley court"></canvas>
<script src="game.js" defer></script>
</body>
</html>
